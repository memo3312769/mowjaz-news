<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>موجز الأخبار</title><style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17202a;--muted:#69747e;--line:#e2e7eb;--dark:#111827}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:5}.top{max-width:1500px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:29px;font-weight:800}.sub{font-size:12px;color:#cbd5e1}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;margin-left:7px}nav{max-width:1500px;margin:auto;padding:0 24px 14px;display:flex;gap:8px;overflow:auto}nav button{border:1px solid #fff3;background:#fff1;color:#fff;border-radius:22px;padding:9px 16px;white-space:nowrap}nav button.active{background:#fff;color:#111827}main{max-width:1500px;margin:24px auto;padding:0 24px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{margin:0;font-size:27px}.refresh{background:#fff;border:1px solid var(--line);padding:10px 15px;border-radius:10px}.layout{display:grid;grid-template-columns:1fr 320px;gap:20px}.hero,.card,.side{background:var(--card);border:1px solid var(--line);border-radius:17px}.hero{padding:26px;margin-bottom:16px}.badge{display:inline-block;background:var(--dark);color:#fff;padding:5px 9px;border-radius:7px;font-size:12px}.hero h2{font-size:30px;line-height:1.4;margin:12px 0 7px}.meta{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{padding:18px}.card h3{font-size:19px;line-height:1.5;margin:9px 0}.card p{color:#56616b;line-height:1.65;font-size:14px}.card a,.hero a{color:inherit}.side{padding:18px;height:max-content;position:sticky;top:145px}.side h2{margin:0 0 8px;font-size:19px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item b{display:block;font-size:14px;line-height:1.5}.item small{color:var(--muted)}.empty{padding:60px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:1fr}.hero h2{font-size:24px}}
</style></head><body><header><div class="top"><div><div class="logo">موجز الأخبار</div><div class="sub">تجميع تلقائي • مصادر متعددة • دمج الأخبار المتشابهة</div></div><div><span class="dot"></span><span id="status">جاري التحميل…</span></div></div><nav id="nav"></nav></header><main><div class="bar"><div><h1 id="title">أهم الأخبار</h1><div class="meta" id="updated">—</div></div><button class="refresh" onclick="load()">↻ تحديث</button></div><div class="layout"><section id="content"></section><aside class="side"><h2>🔴 الأحدث</h2><div id="latest"></div></aside></div></main><script>
const cats=["الكل","مصر","العالم","اقتصاد","رياضة","تكنولوجيا","علوم"];let active="الكل",all=[];const nav=document.getElementById("nav"),content=document.getElementById("content"),latest=document.getElementById("latest"),status=document.getElementById("status"),updated=document.getElementById("updated");
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function navRender(){nav.innerHTML=cats.map(c=>`<button class="${c===active?"active":""}" onclick="pick('${c}')">${c}</button>`).join("")}
function pick(c){active=c;document.getElementById("title").textContent=c==="الكل"?"أهم الأخبار":c;navRender();render()}
function render(){const list=active==="الكل"?all:all.filter(x=>x.cat===active);if(!list.length){content.innerHTML='<div class="empty">لا توجد أخبار متاحة الآن في هذا القسم.</div>';latest.innerHTML="";return}const h=list[0];content.innerHTML=`<article class="hero"><span class="badge">${esc(h.cat)}</span><h2>${esc(h.title)}</h2><div class="meta">${esc(h.source)} • ${new Date(h.date).toLocaleString("ar-EG")}</div><p>${esc(h.description)}</p><a href="${esc(h.link)}" target="_blank" rel="noopener">فتح الخبر في المصدر الأصلي ←</a></article><div class="grid">${list.slice(1,41).map(x=>`<article class="card"><div class="meta">${esc(x.cat)} • ${esc(x.source)}</div><h3><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a></h3><p>${esc(x.description)}</p><div class="meta">${new Date(x.date).toLocaleString("ar-EG")}</div></article>`).join("")}</div>`;latest.innerHTML=list.slice(0,8).map(x=>`<div class="item"><b>${esc(x.title)}</b><small>${esc(x.source)}</small></div>`).join("")}
async function load(){status.textContent="جاري تحميل آخر الأخبار…";try{const r=await fetch("news.json?"+Date.now());if(!r.ok)throw Error();const d=await r.json();all=d.items||[];updated.textContent=`آخر تحديث: ${new Date(d.updatedAt).toLocaleString("ar-EG")} • ${all.length} خبر`;status.textContent="محدث تلقائيًا";render()}catch(e){status.textContent="لم تصل البيانات بعد";content.innerHTML='<div class="empty">سيتم ظهور الأخبار بعد أول تشغيل للتحديث التلقائي.</div>'}}
navRender();load();setInterval(load,15*60*1000);
</script></body></html>

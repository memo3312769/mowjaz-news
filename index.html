<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>موجز الأخبار</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#111827;
  --muted:#64748b;
  --line:#e2e8f0;
  --dark:#0f172a;
  --accent:#2563eb;
}

body.dark{
  --bg:#0b1120;
  --card:#111827;
  --text:#f8fafc;
  --muted:#94a3b8;
  --line:#263244;
  --dark:#020617;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  overflow-x:hidden;
}

header{
  background:var(--dark);
  color:white;
  padding:28px 5%;
}

.header-inner{
  max-width:1450px;
  margin:auto;
}

.logo{
  font-size:38px;
  font-weight:900;
}

.subtitle{
  color:#cbd5e1;
  margin-top:6px;
  font-size:15px;
}

nav{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:24px;
}

nav button{
  border:1px solid #475569;
  background:#1e293b;
  color:white;
  padding:10px 20px;
  border-radius:30px;
  cursor:pointer;
  font-size:16px;
}

nav button.active{
  background:white;
  color:#111827;
}

.status{
  margin-top:18px;
  color:#cbd5e1;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  background:#22c55e;
  border-radius:50%;
  margin-left:7px;
}

main{
  max-width:1450px;
  margin:auto;
  padding:28px 5%;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:22px;
}

input{
  flex:1;
  min-width:240px;
  padding:15px 18px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--card);
  color:var(--text);
  font-size:16px;
}

.action{
  padding:14px 18px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}

.counts{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:22px;
}

.count{
  background:var(--card);
  border:1px solid var(--line);
  padding:9px 14px;
  border-radius:20px;
  color:var(--muted);
}

.ticker{
  background:var(--dark);
  color:white;
  border-radius:16px;
  padding:14px 18px;
  margin-bottom:26px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(280px,1fr);
  gap:22px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:24px;
  margin-bottom:18px;
  min-width:0;
  overflow:hidden;
}

.card h2{
  margin-top:0;
  line-height:1.5;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.card p{
  color:var(--muted);
  line-height:1.9;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.card a{
  color:var(--accent);
  font-weight:700;
  text-decoration:none;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.badge{
  display:inline-block;
  background:var(--dark);
  color:white;
  padding:7px 12px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:12px;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.news-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  min-width:0;
  overflow:hidden;
}

.news-card img{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:13px;
  margin-bottom:12px;
  display:block;
}

.news-card h3{
  margin:5px 0 10px;
  line-height:1.6;
  font-size:19px;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.news-card p{
  color:var(--muted);
  line-height:1.7;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.source{
  color:var(--muted);
  font-size:13px;
}

.side h2{
  margin-top:0;
}

.empty{
  background:var(--card);
  padding:30px;
  border-radius:18px;
  color:var(--muted);
}

footer{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

@media(max-width:900px){
  .layout{
    grid-template-columns:1fr;
  }

  .news-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .logo{
    font-size:30px;
  }

  main{
    padding:20px 4%;
  }

  .card{
    padding:18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">موجز الأخبار</div>
    <div class="subtitle">
      تجميع تلقائي • مصادر متعددة • تنظيم حسب الموضوع
    </div>

    <nav id="nav"></nav>

    <div class="status">
      <span class="dot"></span>
      محدث تلقائيًا
    </div>
  </div>
</header>

<main>

  <div class="toolbar">
    <input id="search" type="search" placeholder="🔎 ابحث في الأخبار...">
    <button class="action" onclick="toggleTheme()">☀️ الوضع</button>
    <button class="action" onclick="loadNews()">↻ تحديث</button>
  </div>

  <div class="counts" id="counts"></div>

  <div class="ticker" id="ticker">
    🔴 جاري تحميل آخر الأخبار...
  </div>

  <div class="layout">

    <section>
      <div id="hero"></div>
      <div class="news-grid" id="newsGrid"></div>
    </section>

    <aside class="side card">
      <h2>📰 آخر الأخبار</h2>
      <div id="latest"></div>
    </aside>

  </div>

</main>

<footer>
  موجز الأخبار — عناوين وملخصات قصيرة مع رابط المصدر الأصلي
</footer>

<script>
const categories = [
  ["الكل","all"],
  ["مصر","مصر"],
  ["العالم","العالم"],
  ["اقتصاد","اقتصاد"],
  ["رياضة","رياضة"],
  ["تكنولوجيا","تكنولوجيا"],
  ["علوم","علوم"]
];

let news = [];
let active = "all";
let dark = false;

const nav = document.getElementById("nav");
const search = document.getElementById("search");

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
function cleanText(value){
  return String(value ?? "")
    .replace(/<[^>]*>/g," ")
    .replace(/&nbsp;/g," ")
    .replace(/&amp;/g,"&")
    .replace(/&quot;/g,'"')
    .replace(/&#39;/g,"'")
    .replace(/&lt;/g,"<")
    .replace(/&gt;/g,">")
    .replace(/\s+/g," ")
    .trim()
    .slice(0,300);
}
function buildNav(){
  nav.innerHTML = categories.map(([name,key]) =>
    `<button class="${active===key ? "active":""}"
      onclick="pick('${key}')">${name}</button>`
  ).join("");
}

function pick(cat){
  active = cat;
  buildNav();
  render();
}

function getList(){
  const q = search.value.trim().toLowerCase();

  return news.filter(x=>{
    const catOK = active==="all" || x.cat===active;
    const text = `${x.title||""} ${x.description||""} ${x.source||""}`.toLowerCase();
    return catOK && (!q || text.includes(q));
  });
}

function formatDate(d){
  const date = new Date(d);
  if(isNaN(date)) return "";
  return date.toLocaleString("ar-EG",{
    year:"numeric",
    month:"numeric",
    day:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function render(){
  const list = getList();

  const counts = {};
  categories.forEach(([name,key])=>{
    counts[key] = key==="all"
      ? news.length
      : news.filter(x=>x.cat===key).length;
  });

  document.getElementById("counts").innerHTML =
    categories.map(([name,key])=>
      `<span class="count">${name}: ${counts[key]}</span>`
    ).join("");

  if(list.length){
    const hero = list[0];

    document.getElementById("hero").innerHTML = `
      <article class="card">
        <span class="badge">${esc(hero.cat || "خبر")}</span>
        ${hero.image ? `<img src="${esc(hero.image)}"
          style="width:100%;max-height:420px;object-fit:cover;border-radius:15px;margin-bottom:18px"
          onerror="this.style.display='none'">` : ""}
        <h2>${esc(hero.title)}</h2>
        <p>${esc(cleanText(hero.description))}</p>
        <div class="source">${esc(hero.source || "")} • ${formatDate(hero.date)}</div>
        <p><a href="${esc(hero.link)}" target="_blank" rel="noopener">
          فتح الخبر في المصدر الأصلي ←
        </a></p>
      </article>
    `;

    document.getElementById("newsGrid").innerHTML =
      list.slice(1,41).map(x=>`
        <article class="news-card">
          ${x.image ? `<img src="${esc(x.image)}"
            onerror="this.style.display='none'">` : ""}
          <span class="source">${esc(x.cat || "خبر")}</span>
          <h3>${esc(x.title)}</h3>
          <p>${esc(cleanText(x.description))}</p>
          <div class="source">${esc(x.source || "")}</div>
          <p>
            <a href="${esc(x.link)}" target="_blank" rel="noopener">
              قراءة الخبر ←
            </a>
          </p>
        </article>
      `).join("");

  }else{
    document.getElementById("hero").innerHTML =
      `<div class="empty">لا توجد أخبار في هذا القسم حاليًا.</div>`;

    document.getElementById("newsGrid").innerHTML = "";
  }

  document.getElementById("latest").innerHTML =
    news.slice(0,12).map(x=>`
      <div style="padding:12px 0;border-bottom:1px solid var(--line)">
        <a href="${esc(x.link)}" target="_blank" rel="noopener">
          ${esc(x.title)}
        </a>
        <div class="source">${esc(x.source || "")}</div>
      </div>
    `).join("");

  document.getElementById("ticker").textContent =
    list.slice(0,6).map(x=>x.title).join(" • ") ||
    "لا توجد أخبار";
}

async function loadNews(){
  document.querySelector(".status").innerHTML =
    '<span class="dot"></span> جاري تحديث الأخبار...';

  try{
    const res = await fetch("news.json?t="+Date.now(),{
      cache:"no-store"
    });

    const data = await res.json();

    /*
      يدعم news.json سواء كان:
      {items:[...]}
      أو
      [...]
    */
    news = Array.isArray(data) ? data : (data.items || []);

    news = news.filter(x=>x && x.title && x.link);

    render();

    document.querySelector(".status").innerHTML =
      `<span class="dot"></span> تم التحديث • ${news.length} خبر`;

  }catch(error){

    document.querySelector(".status").innerHTML =
      '<span style="color:#ef4444">● تعذر تحميل الأخبار</span>';

    document.getElementById("hero").innerHTML =
      `<div class="empty">
        حدثت مشكلة في تحميل الأخبار. حاول تحديث الصفحة.
      </div>`;
  }
}

function toggleTheme(){
  dark = !dark;
  document.body.classList.toggle("dark",dark);
  localStorage.setItem("mowjazDark",dark ? "1":"0");
}

search.addEventListener("input",render);

if(localStorage.getItem("mowjazDark")==="1"){
  dark=true;
  document.body.classList.add("dark");
}

buildNav();
loadNews();

/* تحديث الأخبار المعروضة كل 15 دقيقة */
setInterval(loadNews,15*60*1000);
</script>

</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>موجز الأخبار</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f1f5f9;
  --card:#fff;
  --text:#111827;
  --muted:#64748b;
  --line:#e2e8f0;
  --dark:#0f172a;
  --accent:#2563eb;
  --danger:#dc2626;
}

body.dark{
  --bg:#0b1120;
  --card:#111827;
  --text:#f8fafc;
  --muted:#94a3b8;
  --line:#263244;
  --dark:#020617;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  overflow-x:hidden;
}

header{
  background:var(--dark);
  color:#fff;
  padding:28px 4%;
}

.header{
  max-width:1450px;
  margin:auto;
}

.logo{
  font-size:40px;
  font-weight:900;
}

.subtitle{
  color:#cbd5e1;
  margin-top:6px;
}

nav{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:24px;
}

nav button{
  border:1px solid #475569;
  background:#1e293b;
  color:#fff;
  padding:10px 21px;
  border-radius:30px;
  cursor:pointer;
  font-size:16px;
}

nav button.active{
  background:#fff;
  color:#111827;
}

.status{
  margin-top:18px;
  color:#cbd5e1;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#22c55e;
  margin-left:7px;
}

main{
  max-width:1450px;
  margin:auto;
  padding:28px 4%;
}

.toolbar{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:240px;
  padding:15px 18px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--card);
  color:var(--text);
  font-size:17px;
}

.action{
  padding:14px 19px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  font-size:15px;
}

.counts{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:24px 0;
}

.count{
  background:var(--card);
  border:1px solid var(--line);
  padding:9px 15px;
  border-radius:22px;
  color:var(--muted);
}

.ticker{
  background:var(--dark);
  color:#fff;
  border-radius:17px;
  padding:15px 20px;
  margin-bottom:25px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(280px,1fr);
  gap:22px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:24px;
  margin-bottom:18px;
  min-width:0;
  overflow:hidden;
}

.hero-image{
  width:100%;
  max-height:430px;
  object-fit:cover;
  border-radius:16px;
  display:block;
  margin-bottom:20px;
}

.badge{
  display:inline-block;
  background:var(--dark);
  color:#fff;
  padding:7px 13px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:12px;
}

.hero-title{
  font-size:30px;
  line-height:1.55;
  margin:5px 0 12px;
  overflow-wrap:anywhere;
}

.description{
  color:var(--muted);
  line-height:1.9;
  font-size:16px;
  overflow-wrap:anywhere;
}

.source{
  color:var(--muted);
  font-size:13px;
  margin-top:8px;
}
.source-count{
  display:inline-block;
  margin-right:8px;
  padding:4px 8px;
  border-radius:8px;
  background:#eef2ff;
  color:#3730a3;
  font-size:12px;
  font-weight:800;
}
a{
  color:var(--accent);
  text-decoration:none;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.read{
  display:inline-block;
  margin-top:12px;
  font-weight:700;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.news-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  min-width:0;
  overflow:hidden;
}

.news-image{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:13px;
  display:block;
  margin-bottom:14px;
}

.news-card h3{
  font-size:19px;
  line-height:1.6;
  margin:7px 0 10px;
  overflow-wrap:anywhere;
}

.side h2{
  margin-top:0;
}

.latest-item{
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.latest-item:last-child{
  border-bottom:0;
}

.empty{
  background:var(--card);
  padding:30px;
  border-radius:18px;
  color:var(--muted);
}

footer{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

@media(max-width:900px){
  .layout{
    grid-template-columns:1fr;
  }

  .news-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .logo{font-size:30px}
  main{padding:20px 4%}
  .card{padding:18px}
  .hero-title{font-size:24px}
}
  .important-section{
  margin-bottom:25px;
}

.important-title{
  font-size:25px;
  font-weight:900;
  margin-bottom:15px;
}

.important-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}

.important-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  min-width:0;
}

.important-card img{
  width:100%;
  height:170px;
  object-fit:cover;
  display:block;
}

.important-body{
  padding:17px;
}

.important-card h3{
  margin:8px 0;
  line-height:1.6;
  font-size:18px;
  overflow-wrap:anywhere;
}

.urgent{
  color:#dc2626;
  font-weight:900;
  margin-bottom:7px;
}

@media(max-width:900px){
  .important-grid{
    grid-template-columns:1fr;
  }
}
  .breaking-news{
  background:#dc2626;
  color:#fff;
  border-radius:16px;
  padding:15px 20px;
  margin-bottom:18px;
  font-weight:900;
  font-size:17px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.breaking-news a{
  color:#fff;
  text-decoration:none;
}

.breaking-label{
  margin-left:10px;
  white-space:nowrap;
}
</style>
</head>

<body>

<header>
<div class="header">

  <div class="logo">موجز الأخبار</div>

  <div class="subtitle">
    تجميع تلقائي • مصادر متعددة • تنظيم حسب الموضوع
  </div>

  <nav id="nav"></nav>

  <div class="status" id="status">
    <span class="dot"></span>
    جاري تحميل الأخبار...
  </div>

</div>
</header>

<main>

  <div class="toolbar">

  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 ابحث في الأخبار..."
  >

  <select id="sourceFilter" class="search">
    <option value="all">📰 كل المصادر</option>
  </select>

  <button class="action" onclick="toggleTheme()">
    ☀️ الوضع
  </button>

  <button class="action" onclick="loadNews()">
    ↻ تحديث
  </button>

</div>

  <div class="counts" id="counts"></div>
<section class="important-section">
  <div class="important-title">
    🔥 الأكثر أهمية الآن
  </div>
  <div id="importantNews" class="important-grid"></div>
</section>
  <div id="breakingNews" class="breaking-news" style="display:none"></div>
  <div class="ticker" id="ticker">
    🔴 جاري تحميل آخر الأخبار...
  </div>

  <div class="layout">

    <section>

      <div id="hero"></div>

      <div class="news-grid" id="newsGrid"></div>

    </section>

    <aside class="card side">

      <h2>📰 آخر الأخبار</h2>1

      <div id="latest"></div>

    </aside>

  </div>

</main>

<footer>
  موجز الأخبار — عناوين وملخصات قصيرة مع رابط المصدر الأصلي
</footer>

<script>

const categories = [
  ["الكل","all"],
  ["مصر","مصر"],
  ["العالم","العالم"],
  ["اقتصاد","اقتصاد"],
  ["رياضة","رياضة"],
 ,  ["تكنولوجيا","تكنولوجيا"],
  ["علوم","علوم"]
];

let news = [];
let active = "all";
let dark = false;

const nav = document.getElementById("nav");
const search = document.getElementById("search");

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function cleanText(value){

  return String(value ?? "")
    .replace(/<script[\s\S]*?<\/script>/gi," ")
    .replace(/<style[\s\S]*?<\/style>/gi," ")
    .replace(/<[^>]*>/g," ")
    .replace(/https?:\/\/\S+/g," ")
    .replace(/&nbsp;/gi," ")
    .replace(/&amp;/gi,"&")
    .replace(/&quot;/gi,'"')
    .replace(/&#39;/gi,"'")
    .replace(/&lt;/gi,"<")
    .replace(/&gt;/gi,">")
    .replace(/\s+/g," ")
    .trim()
    .slice(0,320);

}

function buildNav(){

  nav.innerHTML = "";

  categories.forEach(([name,key]) => {

    const button = document.createElement("button");

    button.textContent = name;

    if(active === key){
      button.classList.add("active");
    }

    button.addEventListener("click",function(){

      active = key;

      buildNav();

      render();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    });

    nav.appendChild(button);

  });

}

function importanceScore(x){

  const title = String(x.title || "").toLowerCase();

  const urgentWords = [
    "عاجل",
    "زلزال",
    "حرب",
    "هجوم",
    "انفجار",
    "وفاة",
    "مقتل",
    "تحذير",
    "كارثة",
    "إغلاق",
    "طوارئ"
  ];

  const importantWords = [
    "رئيس",
    "حكومة",
    "وزير",
    "قرار",
    "اتفاق",
    "انتخابات",
    "أزمة",
    "مصر",
    "السعودية",
    "إيران",
    "أمريكا",
    "روسيا",
    "إسرائيل"
  ];

  let score = 0;

  urgentWords.forEach(word => {
    if(title.includes(word)) score += 5;
  });

  importantWords.forEach(word => {
    if(title.includes(word)) score += 2;
  });

  return score;
}


function isUrgent(x){

  const title = String(x.title || "").toLowerCase();

  const words = [
    "عاجل",
    "زلزال",
    "حرب",
    "هجوم",
    "انفجار",
    "وفاة",
    "مقتل",
    "تحذير",
    "كارثة",
    "طوارئ"
  ];

  return words.some(word => title.includes(word));
}


function getList(){

  const q = search.value.trim().toLowerCase();

  return news
    .filter(x => {

      const categoryOK =
        active === "all" ||
        x.cat === active;

      const text =
        `${x.title || ""} ${x.description || ""} ${x.source || ""}`
        .toLowerCase();

      return categoryOK &&
        (!q || text.includes(q));

    })
    .sort((a,b) => {

      const scoreA = importanceScore(a);
      const scoreB = importanceScore(b);

      if(scoreA !== scoreB){
        return scoreB - scoreA;
      }

      return new Date(b.date || 0) -
             new Date(a.date || 0);

    });

}

function formatDate(value){

  const d = new Date(value);

  if(isNaN(d)) return "";

  return d.toLocaleString("ar-EG",{
    year:"numeric",
    month:"numeric",
    day:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });

}

function fallbackImage(category){

  const images = {
    "مصر":
      "https://images.unsplash.com/photo-1568322445389-f64ac2515020?auto=format&fit=crop&w=1200&q=80",

    "العالم":
      "https://images.unsplash.com/photo-1521295121783-8a321d551ad2?auto=format&fit=crop&w=1200&q=80",

    "اقتصاد":
      "https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?auto=format&fit=crop&w=1200&q=80",

    "رياضة":
      "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=1200&q=80",

    "تكنولوجيا":
      "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80",

    "علوم":
      "https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=1200&q=80"
  };

  return images[category] || images["العالم"];
}


function imageHTML(url,className,category){

  const image = url || fallbackImage(category);

  return `
    <img
      class="${className}"
      src="${esc(image)}"
      loading="lazy"
      onerror="this.style.display='none'"
      alt="${esc(category || "خبر")}"
    >
  `;
}

function render(){

  const list = getList();
  const urgent = list.find(x => isUrgent(x));

const breaking = document.getElementById("breakingNews");

if(urgent){

  breaking.style.display = "block";

  breaking.innerHTML = `
    <span class="breaking-label">🔴 عاجل الآن:</span>
    <a
      href="${esc(urgent.link)}"
      target="_blank"
      rel="noopener noreferrer"
    >
      ${esc(urgent.title)}
    </a>
  `;

}else{

  breaking.style.display = "none";
  breaking.innerHTML = "";

}
const important = [...list]
  .sort((a,b) => importanceScore(b) - importanceScore(a))
  .slice(0,3);

document.getElementById("importantNews").innerHTML =
  important.map(x => `
    <article class="important-card">

      ${imageHTML(x.image,"news-image",x.cat)}

      <div class="important-body">

        ${isUrgent(x)
          ? '<div class="urgent">🔴 عاجل</div>'
          : '<div class="source">⭐ مهم</div>'
        }

        <h3>${esc(x.title)}</h3>

        <div class="source">
          ${esc(x.source || "")}
        </div>

        <a
          class="read"
          href="${esc(x.link)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          قراءة الخبر ←
        </a>

      </div>

    </article>
  `).join("");
  const counts = {};

  categories.forEach(([name,key]) => {

    counts[key] =
      key === "all"
      ? news.length
      : news.filter(x => x.cat === key).length;

  });

  document.getElementById("counts").innerHTML =
    categories.map(([name,key]) =>
      `<span class="count">${name}: ${counts[key]}</span>`
    ).join("");

  if(list.length){

    const hero = list[0];

    document.getElementById("hero").innerHTML = `

      <article class="card">

        <span class="badge">
          ${esc(hero.cat || "خبر")}
        </span>

        ${imageHTML(hero.image,"hero-image",hero.cat)}
${isUrgent(hero) ? '<div style="color:#dc2626;font-weight:900;margin-bottom:10px">🔴 عاجل</div>' : ""}
        <h1 class="hero-title">
          ${esc(hero.title)}
        </h1>

        <p class="description">
          ${esc(cleanText(hero.description))}
        </p>

        <div class="source">
          ${esc(hero.source || "")}
          ${hero.date ? " • " + formatDate(hero.date) : ""}
        </div>

        <a
          class="read"
          href="${esc(hero.link)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          فتح الخبر في المصدر الأصلي ←
        </a>

      </article>
    `;

    document.getElementById("newsGrid").innerHTML =

      list.slice(1,41).map(x => `

        <article class="news-card">

          ${imageHTML(x.image,"news-image",x.cat)}

          <div class="source">
            ${esc(x.cat || "خبر")}
          </div>
          ${Number(x.sourceCount || 1) > 1
  ? `<span class="source-count">📰 ${x.sourceCount === 2 ? "مصدران" : x.sourceCount + " مصادر"}</span>`
  : ""}ر
${isUrgent(x) ? '<div style="color:#dc2626;font-weight:900;margin-bottom:8px">🔴 عاجل</div>' : ""}
          <h3>
            ${esc(x.title)}
          </h3>

          <p class="description">
            ${esc(cleanText(x.description))}
          </p>

          <div class="source">
  ${esc((x.sources || [x.source || ""]).join(" · "))}
</div>

          <a
            class="read"
            href="${esc(x.link)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            قراءة الخبر ←
          </a>

        </article>

      `).join("");

  }else{

    document.getElementById("hero").innerHTML =
      `<div class="empty">
        لا توجد أخبار في هذا القسم حاليًا.
      </div>`;

    document.getElementById("newsGrid").innerHTML = "";

  }

  document.getElementById("latest").innerHTML =

    news.slice(0,15).map(x => `

      <div class="latest-item">

        <a
          href="${esc(x.link)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${esc(x.title)}
        </a>

        <div class="source">
          ${esc(x.source || "")}
        </div>

      </div>

    `).join("");

  document.getElementById("ticker").textContent =

    list.slice(0,8)
      .map(x => x.title)
      .join(" • ") ||

    "لا توجد أخبار";

}

async function loadNews(){

  document.getElementById("status").innerHTML =
    '<span class="dot"></span> جاري تحديث الأخبار...';

  try{

    const [mainResponse, telegramResponse] = await Promise.all([
      fetch("news.json?t=" + Date.now(), {
        cache: "no-store"
      }),
      fetch("telegram_news.json?t=" + Date.now(), {
        cache: "no-store"
      })
    ]);

    if(!mainResponse.ok){
      throw new Error("news.json error");
    }

    const mainData = await mainResponse.json();

    const telegramData = telegramResponse.ok
      ? await telegramResponse.json()
      : [];

    const mainNews = Array.isArray(mainData)
      ? mainData
      : (mainData.items || []);

    const telegramNews = Array.isArray(telegramData)
      ? telegramData
      : (telegramData.items || []);

    const combined = [
      ...telegramNews,
      ...mainNews
    ];

    const seen = new Set();

    news = combined.filter(x => {

      if(!x || !x.title || !x.link){
        return false;
      }

      if(seen.has(x.link)){
        return false;
      }

      seen.add(x.link);
      return true;

    });

    render();

    document.getElementById("status").innerHTML =
      '<span class="dot"></span> تم التحديث — ' +
      news.length + ' خبر';

  }catch(error){

    console.error(error);

    document.getElementById("status").innerHTML =
      '<span style="color:#ef4444">⚠ تعذر تحميل الأخبار</span>';

    document.getElementById("hero").innerHTML = `
      <div class="empty">
        حدثت مشكلة في تحميل الأخبار.
      </div>
    `;

  }

}

function toggleTheme(){

  dark = !dark;

  document.body.classList.toggle("dark",dark);

  localStorage.setItem(
    "mowjazDark",
    dark ? "1" : "0"
  );

}

search.addEventListener("input",render);

if(localStorage.getItem("mowjazDark") === "1"){

  dark = true;

  document.body.classList.add("dark");

}

buildNav();

loadNews();

setInterval(
  loadNews,
  15 * 60 * 1000
);

</script>

</body>
</html>
